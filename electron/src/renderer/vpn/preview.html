<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Tally — предупреждение</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="vpn.css" />
  </head>
  <body>
    <div class="panel" id="root"></div>
    <script>
      const payload = {
        status: {
          verdict: 'blocked',
          country: 'RU',
          reason: 'Трафик выходит из страны RU — Claude оттуда недоступен. Похоже, VPN выключен.',
          checkedAt: Date.now(),
        },
        vpnAppPath: '/Applications/AmneziaVPN.app',
      };
      let cb = null;
      window.tally = {
        onVpnPayload: (fn) => {
          cb = fn;
          setTimeout(() => fn(payload), 0);
        },
        recheckVpn: () => Promise.resolve(payload.status),
        openVpnApp: () => {},
        closeVpnWarning: () => {},
        updateSettings: () => Promise.resolve({}),
      };
    </script>
    <script src="index.js"></script>
  </body>
</html>
